name: Android CI

on:
  push:
    branches:
      - main
      - "v3/**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android toolchain
        run: |
          sdkmanager             "platforms;android-36"             "build-tools;36.0.0"             "ndk;29.0.14206865"             "cmake;3.22.1"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Native SPSC ring-buffer test
        run: |
          g++ -std=c++20 -O2 -pthread             tools/native_tests/ring_buffer_test.cpp             -o /tmp/budsia-ring-buffer-test
          /tmp/budsia-ring-buffer-test

      - name: Fetch verified neural runtime
        run: bash scripts/fetch_sherpa_runtime.sh

      - name: Validate pinned neural model asset
        run: |
          MODEL=/tmp/dpdfnet2_48khz_hr.onnx
          curl --fail --location --retry 4 --retry-delay 2 \
            --output "$MODEL" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speech-enhancement-models/dpdfnet2_48khz_hr.onnx
          echo "0b399f8a58dc4d70d8cd97541f5c39869406145193b957d00a03b66070944928  $MODEL" | sha256sum --check -
          test "$(stat --format=%s "$MODEL")" = "10596848"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify neural runtime packaged
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/libsherpa-onnx-jni.so"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/libonnxruntime.so"

      - name: Release compile
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BudsIA-V3-streaming-ai-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
