name: Android CI

on:
  push:
    branches:
      - main
      - "v3/**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android toolchain
        run: |
          sdkmanager             "platforms;android-36"             "build-tools;36.0.0"             "ndk;29.0.14206865"             "cmake;3.22.1"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Native SPSC ring-buffer test
        run: |
          g++ -std=c++20 -O2 -pthread             tools/native_tests/ring_buffer_test.cpp             -o /tmp/budsia-ring-buffer-test
          /tmp/budsia-ring-buffer-test

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Release compile
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BudsIA-V3-native-audio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
